<!DOCTYPE html>

<html class="h-full" lang="en"><head>

<style>
        body {
            background-color: #FDFCF8; /* Warm Off-White Level 0 */
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            display: none;
        }
        .form-card {
            box-shadow: 0 -4px 30px rgba(1, 45, 29, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full w-full font-body-md text-on-surface flex flex-col md:flex-row antialiased">
<!-- TopAppBar (Web & Mobile context) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim flex justify-between items-center px-container-padding py-4 max-w-full">
<!-- Leading Action: Back (since it's a sub-page/transactional) -->
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:opacity-80 active:scale-95 text-on-surface-variant dark:text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-primary dark:text-primary-fixed text-center flex-1">Add Field</h1>
<!-- Trailing Action: Cancel (Invisible placeholder to balance center alignment if needed, or an actual cancel button) -->
<button aria-label="Placeholder" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors active:opacity-80 active:scale-95 text-on-surface-variant dark:text-outline opacity-0 pointer-events-none">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-[80px] pb-32 px-gutter md:px-container-padding w-full max-w-3xl mx-auto flex flex-col gap-card-gap">
<!-- Form Container Level 1 (Card) -->
<div class="bg-[#FFFFFF] rounded-[24px] p-container-padding form-card shadow-[0_4px_30px_rgba(1,45,29,0.04)] flex flex-col gap-card-gap mt-unit relative">
<!-- Context/Header -->
<div class="flex items-center justify-between mb-2 border-b border-surface-variant pb-4">
<div class="flex items-center gap-3 text-primary">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">landscape</span>
<h2 class="font-title-md text-title-md">Field Details</h2>
</div>
<!-- Provenance Badge Example (Manual Entry) -->
<div class="inline-flex items-center gap-2 bg-secondary-container/30 text-secondary-fixed-dim px-3 py-1 rounded-full border border-secondary-container">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">edit_document</span>
<span class="font-label-sm text-label-sm text-secondary">Manual Entry</span>
</div>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Field Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="fieldName">Field Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">label</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-secondary focus:bg-surface transition-all" id="fieldName" placeholder="e.g., North Pasture" type="text"/>
</div>
</div>
<!-- Location (Map Pin Placeholder) -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="location">Location</label>
<div class="relative w-full h-48 rounded-xl overflow-hidden border-2 border-surface-container-high bg-surface-container-low group cursor-pointer hover:border-secondary transition-colors">
<!-- Placeholder Map Image -->
<div class="bg-cover bg-center w-full h-full opacity-80 group-hover:opacity-100 transition-opacity" data-alt="A stylized, top-down satellite map view of agricultural farmland in warm earthy tones, bright and clear, illustrating a location selection interface in a modern farming app, peaceful and functional aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAlCGuep7nBhDYsj1Iqy8Kv4voa58TfnT0egmbnzi9ZT0EJsghOjqhqU7ZAqQ5DVbmbHAFr3CkHB5d1tkIHSlQoZOa4lzFiVQcO_SO7q6Fkz6oBnzvUYp0LNtkrQUEPm9TK7KECRD2yKA4zEXPplewUooyqoRl1sxQB5Jc-GxgW3iFHRx9ZPRNLbEHsK43RkzoEFRIUTtEVf5Yl5pSkeKuB29bhPtn1ypOE7SqjD2oWV2fYI-9yx1-MmQ')"></div>
<div class="absolute inset-0 flex flex-col items-center justify-center bg-surface-variant/30 backdrop-blur-[2px]">
<div class="bg-primary text-on-primary rounded-full p-3 shadow-lg mb-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<span class="font-label-md text-label-md text-primary bg-surface/80 px-3 py-1 rounded-full shadow-sm backdrop-blur-sm">Tap to drop pin</span>
</div>
</div>
</div>
<!-- Field Size -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="fieldSize">Field Size</label>
<div class="flex gap-4">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">straighten</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-secondary focus:bg-surface transition-all" id="fieldSize" placeholder="0.00" type="number"/>
</div>
<select class="bg-surface-container-low border-none rounded-xl py-4 px-6 font-body-lg text-on-surface focus:ring-2 focus:ring-secondary focus:bg-surface transition-all cursor-pointer" id="sizeUnit">
<option value="acres">Acres</option>
<option value="hectares">Hectares</option>
</select>
</div>
</div>
<!-- Split Row for Sowing Date & Crop Type for better visual density -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Crop Type -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="cropType">Crop Type</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline z-10 pointer-events-none">grass</span>
<select class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-10 font-body-lg text-on-surface focus:ring-2 focus:ring-secondary focus:bg-surface transition-all appearance-none cursor-pointer" id="cropType">
<option class="text-outline-variant" disabled="" selected="" value="">Select Crop...</option>
<option value="corn">Corn</option>
<option value="wheat">Wheat</option>
<option value="soybeans">Soybeans</option>
<option value="cotton">Cotton</option>
<option value="alfalfa">Alfalfa</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Sowing Date -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="sowingDate">Sowing Date</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline z-10 pointer-events-none">calendar_month</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 font-body-lg text-on-surface focus:ring-2 focus:ring-secondary focus:bg-surface transition-all cursor-pointer text-on-surface" id="sowingDate" type="date"/>
</div>
</div>
</div>
<!-- Soil Type & Irrigation Method Bento -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-2">
<!-- Soil Type Selector (Radio Pills) -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-[20px] p-4 flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[20px]">layers</span>
<span class="font-label-md text-label-md text-on-surface-variant">Soil Type</span>
</div>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input class="peer sr-only" name="soilType" type="radio" value="clay"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface text-on-surface-variant font-label-sm text-label-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container transition-colors">Clay</div>
</label>
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="soilType" type="radio" value="loam"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface text-on-surface-variant font-label-sm text-label-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container transition-colors">Loam</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="soilType" type="radio" value="sandy"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface text-on-surface-variant font-label-sm text-label-sm peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:border-secondary-container transition-colors">Sandy</div>
</label>
</div>
</div>
<!-- Irrigation Method -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-[20px] p-4 flex flex-col gap-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[20px]">water_drop</span>
<span class="font-label-md text-label-md text-on-surface-variant">Irrigation Method</span>
</div>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="irrigation" type="radio" value="drip"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface text-on-surface-variant font-label-sm text-label-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">water</span> Drip
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="irrigation" type="radio" value="sprinkler"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface text-on-surface-variant font-label-sm text-label-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">shower</span> Sprinkler
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="irrigation" type="radio" value="flood"/>
<div class="px-4 py-2 rounded-full border border-surface-variant bg-surface text-on-surface-variant font-label-sm text-label-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary-container transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">waves</span> Flood
                                </div>
</label>
</div>
</div>
</div>
</form>
</div>
</main>
<!-- Sticky Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-variant p-4 z-40 md:bg-transparent md:border-none md:backdrop-blur-none md:static md:p-0 md:mt-8 md:max-w-3xl md:mx-auto pb-8 md:pb-0 shadow-[0_-4px_30px_rgba(1,45,29,0.04)] md:shadow-none">
<button class="w-full bg-primary text-on-primary rounded-full py-4 font-title-md text-title-md flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Save Field
        </button>
</div>
<!-- Note: BottomNavBar is suppressed here because this is a transactional "Add/Create" screen (a temporary departure from main nav flow). -->
</body></html>
