<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AquaSmart - My Fields</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1a1c18",
                        "inverse-surface": "#2f312c",
                        "on-surface": "#1a1c18",
                        "background": "#f9faf2",
                        "on-primary-fixed-variant": "#274e3d",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e9e1",
                        "surface-container": "#edefe7",
                        "primary-container": "#1b4332",
                        "tertiary-fixed": "#cee9d3",
                        "primary-fixed-dim": "#a5d0b9",
                        "on-primary-fixed": "#002114",
                        "on-secondary-container": "#316e52",
                        "surface-dim": "#d9dbd3",
                        "secondary-fixed": "#b1f0ce",
                        "on-tertiary-fixed-variant": "#354c3b",
                        "outline-variant": "#c1c8c2",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#b3cdb7",
                        "surface-variant": "#e2e3db",
                        "surface-bright": "#f9faf2",
                        "on-secondary-fixed-variant": "#0e5138",
                        "tertiary-container": "#2a4131",
                        "primary": "#012d1d",
                        "secondary-fixed-dim": "#95d4b3",
                        "primary-fixed": "#c1ecd4",
                        "surface-tint": "#3f6653",
                        "tertiary": "#152b1c",
                        "secondary-container": "#aeeecb",
                        "inverse-on-surface": "#f0f1e9",
                        "surface": "#f9faf2",
                        "on-tertiary-fixed": "#092012",
                        "surface-container-highest": "#e2e3db",
                        "on-tertiary-container": "#93ad98",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#86af99",
                        "inverse-primary": "#a5d0b9",
                        "on-primary": "#ffffff",
                        "secondary": "#2c694e",
                        "on-error": "#ffffff",
                        "outline": "#717973",
                        "on-surface-variant": "#414844",
                        "on-secondary-fixed": "#002114",
                        "surface-container-low": "#f3f4ec",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "32px",
                        "card-gap": "20px",
                        "gutter": "24px",
                        "base": "8px",
                        "container-padding-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Manrope"],
                        "display-kpi": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-md": ["Manrope"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-kpi": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background h-full font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 bg-surface shadow-sm z-40 hidden md:flex">
<div class="flex justify-between items-center px-container-padding-desktop h-16 w-full">
<div class="flex items-center gap-4 cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-high px-3 py-2 rounded-lg">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-headline-md text-headline-md font-bold text-primary">AquaSmart</span>
</div>
<nav class="flex gap-8">
<a class="font-headline-md text-headline-md text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-2 rounded-lg" href="#">Dashboard</a>
<a class="font-headline-md text-headline-md text-primary bg-secondary-container rounded-lg px-4 py-2" href="#">Fields</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-2 rounded-lg" href="#">AI</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-2 rounded-lg" href="#">Weather</a>
<a class="font-headline-md text-headline-md text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-2 rounded-lg" href="#">Settings</a>
</nav>
<div class="cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-high p-2 rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">notifications</span>
</div>
</div>
</header>
<header class="w-full top-0 bg-surface shadow-sm z-40 md:hidden sticky">
<div class="flex justify-between items-center px-container-mobile h-16 w-full">
<div class="flex items-center gap-2 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-headline-md text-headline-md font-bold text-primary">AquaSmart</span>
</div>
<div class="cursor-pointer active:scale-95 transition-transform hover:bg-surface-container-high p-2 rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">notifications</span>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 w-full max-w-7xl mx-auto px-container-padding-mobile md:px-container-padding-desktop py-8 mb-24 md:mb-0">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">My Fields</h1>
<button id="addFieldButton" class="bg-primary text-on-primary font-label-caps text-label-caps px-6 py-3 rounded-lg flex items-center gap-2 hover:bg-primary-container transition-colors shadow-sm w-full md:w-auto justify-center">
<span class="material-symbols-outlined">add</span>
                ADD NEW FIELD
            </button>
</div>
<div class="flex flex-col md:flex-row gap-4 mb-8">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full bg-[#F1F2E9] border-none rounded-lg pl-12 pr-4 py-3 text-body-md focus:ring-2 focus:ring-secondary focus:bg-surface-container-lowest transition-colors placeholder:text-outline-variant text-on-surface" placeholder="Search fields, crops..." type="text"/>
</div>
<button class="flex items-center justify-center gap-2 px-6 py-3 bg-surface border-[1.5px] border-secondary text-secondary rounded-lg font-label-caps text-label-caps hover:bg-surface-container-low transition-colors w-full md:w-auto">
<span class="material-symbols-outlined">filter_list</span>
                FILTER
            </button>
</div>
<div id="fieldList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-gutter"></div>
</main>

<div id="fieldModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#012d1d]/40 p-4">
  <div class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-primary">Add New Field</h2>
      <button id="closeFieldModal" class="material-symbols-outlined text-2xl text-on-surface-variant" type="button">close</button>
    </div>

    <form id="fieldForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="fieldName">Field name</label>
        <input id="fieldName" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2" required type="text" />
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="fieldCrop">Crop type</label>
        <select id="fieldCrop" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2">
          <option>Wheat</option>
          <option>Rice</option>
          <option>Maize</option>
          <option>Cotton</option>
          <option>Sugarcane</option>
          <option>Potato</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="fieldSize">Field size</label>
        <input id="fieldSize" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2" required min="0.1" step="0.1" type="number" />
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="sizeUnit">Unit</label>
        <select id="sizeUnit" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2">
          <option value="acre">Acre</option>
          <option value="hectare">Hectare</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="soilType">Soil type</label>
        <select id="soilType" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2">
          <option>Loamy</option>
          <option>Clay</option>
          <option>Sandy</option>
          <option>Silt</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="region">Region</label>
        <select id="region" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2">
          <option>North</option>
          <option>South</option>
          <option>East</option>
          <option>West</option>
          <option>Central</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="sowingDate">Sowing date</label>
        <input id="sowingDate" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2" type="date" />
      </div>

      <div>
        <label class="block text-sm font-medium text-on-surface-variant mb-1" for="irrigationType">Irrigation type</label>
        <select id="irrigationType" class="w-full rounded-lg border border-outline-variant bg-surface-container-low px-3 py-2">
          <option>Drip</option>
          <option>Sprinkler</option>
          <option>Canal</option>
          <option>Rainfed</option>
        </select>
      </div>

      <div class="md:col-span-2 flex gap-3 justify-end pt-2">
        <button id="cancelFieldButton" class="rounded-lg border border-outline-variant px-4 py-2 text-on-surface-variant" type="button">Cancel</button>
        <button id="saveFieldButton" class="rounded-lg bg-primary px-5 py-2 text-on-primary" type="submit">Save Field</button>
      </div>
    </form>
  </div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface shadow-[0px_-4px_20px_rgba(27,67,50,0.06)] px-2 md:hidden rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-sm text-label-sm">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 transition-all duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">agriculture</span>
<span class="font-label-sm text-label-sm font-semibold">Fields</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">psychology</span>
<span class="font-label-sm text-label-sm">AI</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">cloudy_snowing</span>
<span class="font-label-sm text-label-sm">Weather</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all duration-200 w-16" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</a>
</nav>
<script>
  const API_BASE = window.location.origin || 'http://127.0.0.1:8001';
  const fieldList = document.getElementById('fieldList');
  const addFieldButton = document.getElementById('addFieldButton');
  const fieldModal = document.getElementById('fieldModal');
  const fieldForm = document.getElementById('fieldForm');
  const closeFieldModal = document.getElementById('closeFieldModal');
  const cancelFieldButton = document.getElementById('cancelFieldButton');

  function getUserId() {
    const saved = Number(localStorage.getItem('aqua_user_id'));
    if (!saved) {
      window.location.href = '/frontend/login.html';
      return 0;
    }
    return saved;
  }

  function openFieldModal() {
    fieldModal.classList.remove('hidden');
    fieldModal.classList.add('flex');
  }

  function closeFieldModalDialog() {
    fieldModal.classList.add('hidden');
    fieldModal.classList.remove('flex');
    fieldForm.reset();
  }

  function getStatusBadge(moisture) {
    if (moisture < 35) return { label: 'DRY', className: 'bg-[#ba1a1a]/15 text-[#ba1a1a]' };
    if (moisture < 55) return { label: 'WATCH', className: 'bg-[#d97706]/15 text-[#d97706]' };
    return { label: 'OPTIMAL', className: 'bg-[#2c694e]/15 text-[#2c694e]' };
  }

  function renderFields(fields) {
    if (!fields.length) {
      fieldList.innerHTML = '<div class="col-span-full rounded-xl border border-dashed border-outline-variant bg-surface-container-lowest p-8 text-center text-on-surface-variant">No fields yet. Add your first field to start tracking irrigation.</div>';
      return;
    }

    fieldList.innerHTML = fields.map((field) => {
      const badge = getStatusBadge(field.sensor_readings?.[0]?.soil_moisture ?? 52);
      const cropName = field.crop_type || 'Crop';
      const area = Number(field.field_area_hectare || 0).toFixed(1);
      return `
        <div class="bg-surface-container-lowest rounded-xl p-gutter shadow-[0px_4px_20px_rgba(27,67,50,0.06)] hover:shadow-[0px_12px_32px_rgba(27,67,50,0.12)] hover:-translate-y-0.5 transition-all duration-300 flex flex-col group border border-transparent hover:border-secondary-container">
          <div class="w-full h-40 bg-surface-container-high rounded-lg mb-6 overflow-hidden relative">
            <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=900&q=80" alt="${field.name} field" />
            <div class="absolute top-4 right-4 bg-secondary-fixed/90 backdrop-blur-sm text-on-secondary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm flex items-center gap-1 shadow-sm border border-secondary-fixed-dim">
              <span class="material-symbols-outlined text-[16px]">water_drop</span>
              ${field.sensor_readings?.[0]?.soil_moisture ?? 52}% Moisture
            </div>
          </div>
          <div class="flex justify-between items-start mb-4">
            <div>
              <h2 class="font-headline-md text-headline-md text-on-surface mb-1">${field.name}</h2>
              <p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">grass</span> ${cropName} • ${area}ha
              </p>
            </div>
            <span class="px-3 py-1 rounded-full font-label-caps text-label-caps border ${badge.className}">${badge.label}</span>
          </div>
          <div class="mt-auto pt-6">
            <button class="w-full bg-transparent border-[1.5px] border-secondary text-secondary font-label-caps text-label-caps py-3 rounded-lg hover:bg-secondary hover:text-on-secondary transition-colors flex items-center justify-center gap-2" onclick="window.location.href='/frontend/dashboard.html'">
              VIEW FIELD <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function loadFields() {
    const userId = getUserId();
    if (!userId) return;

    try {
      const response = await fetch(`${API_BASE}/api/fields?user_id=${userId}`);
      if (!response.ok) {
        throw new Error('Unable to load fields.');
      }
      const fields = await response.json();
      renderFields(fields);
    } catch (error) {
      fieldList.innerHTML = '<div class="col-span-full rounded-xl border border-dashed border-outline-variant bg-surface-container-lowest p-8 text-center text-on-surface-variant">Unable to load fields from the irrigation service. Please try again.</div>';
    }
  }

  addFieldButton.addEventListener('click', openFieldModal);
  closeFieldModal.addEventListener('click', closeFieldModalDialog);
  cancelFieldButton.addEventListener('click', closeFieldModalDialog);
  fieldModal.addEventListener('click', (event) => {
    if (event.target === fieldModal) {
      closeFieldModalDialog();
    }
  });

  fieldForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const userId = getUserId();
    if (!userId) return;

    const payload = {
      user_id: userId,
      name: document.getElementById('fieldName').value.trim(),
      crop_type: document.getElementById('fieldCrop').value,
      field_size: Number(document.getElementById('fieldSize').value),
      size_unit: document.getElementById('sizeUnit').value,
      soil_type: document.getElementById('soilType').value,
      region: document.getElementById('region').value,
      sowing_date: document.getElementById('sowingDate').value || null,
      irrigation_type: document.getElementById('irrigationType').value,
    };

    if (!payload.name || !payload.field_size) {
      alert('Please enter a field name and size.');
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/api/fields`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.detail || 'Unable to save field.');
      }

      closeFieldModalDialog();
      await loadFields();
    } catch (error) {
      alert(error.message || 'Unable to save field.');
    }
  });

  loadFields();
</script>
</body></html>
